# Base comum a todos os ambientes. Arquivos que complementam este:
#   compose.override.yaml    → desenvolvimento (carregado sozinho pelo `docker compose up`)
#   compose.production.yaml  → produção (docker compose -f compose.yaml -f compose.production.yaml ...)
name: burnless

x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-burnless}:${POSTGRES_PASSWORD:-burnless}@db:5432/${POSTGRES_DB:-burnless}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnless}
      POSTGRES_DB: ${POSTGRES_DB:-burnless}
    volumes:
      # O Postgres 18 da imagem oficial usa /var/lib/postgresql (não mais .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: *database-url
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Tarefa avulsa (profile "tools"): não sobe com `docker compose up`.
  # Uso: docker compose --profile tools run --rm migrate
  migrate:
    profiles: [tools]
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
