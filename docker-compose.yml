# Ambiente de DESENVOLVIMENTO: API com hot reload + Postgres.
# Uso: docker compose up --build
name: burnless

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnless}
      POSTGRES_DB: ${POSTGRES_DB:-burnless}
    ports:
      - "5432:5432"
    volumes:
      # O Postgres 18 da imagem oficial usa /var/lib/postgresql (não mais .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-burnless}:${POSTGRES_PASSWORD:-burnless}@db:5432/${POSTGRES_DB:-burnless}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
